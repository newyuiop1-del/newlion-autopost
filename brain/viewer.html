<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brain Cinema</title>
<style>
  :root { --panel: rgba(14,18,34,.78); --line: rgba(160,180,255,.18); --text: #e8ecff; --dim: #8f97b8; --accent: #ff9a3c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #03040a; color: var(--text); font: 14px/1.45 system-ui, "Noto Sans Thai", "Sukhumvit Set", sans-serif; overflow: hidden; }
  #graph { position: fixed; inset: 0; }
  .panel { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; backdrop-filter: blur(14px); padding: 16px; }
  #side { left: 16px; bottom: 16px; width: 260px; max-height: calc(100% - 32px); overflow: auto; }
  #side small { letter-spacing: .25em; color: var(--dim); font-size: 10px; }
  #side h1 { margin: 2px 0 0; font-size: 26px; letter-spacing: .08em; }
  #side .sub { color: var(--dim); margin: 0 0 12px; }
  #legend label { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; }
  #legend input { display: none; }
  #legend input:not(:checked) ~ * , #legend label:has(input:not(:checked)) { opacity: .35; }
  #legend i, li i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
  #legend span, li span { margin-left: auto; color: var(--dim); font-size: 12px; }
  .btns { display: flex; gap: 8px; margin: 14px 0 8px; }
  button { flex: 1; border: 0; border-radius: 999px; padding: 9px 12px; font: inherit; cursor: pointer; color: #1b1205; background: linear-gradient(#ffb36b, #ff8a2a); }
  button.ghost { background: rgba(255,255,255,.12); color: var(--text); }
  button.ghost.on { background: #dfe6ff; color: #0b1020; }
  #q { width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: rgba(0,0,0,.35); color: var(--text); font: inherit; }
  ul { list-style: none; margin: 6px 0 0; padding: 0; }
  li { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 8px; cursor: pointer; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  li:hover { background: rgba(255,255,255,.08); }
  #machines li, #peers li { cursor: default; flex-wrap: wrap; white-space: normal; }
  #connect { margin: 12px 0 4px; padding: 10px; border: 1px solid var(--line); border-radius: 12px; display: grid; gap: 6px; }
  #connect input { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: rgba(0,0,0,.35); color: var(--text); font: inherit; width: 100%; }
  #connect .me { font-size: 12px; color: #ffd9a0; word-break: break-all; }
  #connectMsg { font-size: 12px; }
  #connectMsg.err { color: #ff8f8f; } #connectMsg.ok { color: #8fffb0; }
  #peers li button { flex: none; padding: 2px 8px; font-size: 11px; background: rgba(255,255,255,.1); color: var(--dim); }
  #status { color: var(--dim); font-size: 12px; margin-top: 8px; }
  .hint { color: var(--dim); font-size: 11px; margin-top: 6px; }
  #info { right: 16px; top: 16px; width: 320px; max-height: calc(100% - 32px); overflow: auto; }
  #info h3 { margin: 0 0 4px; word-break: break-all; }
  #info p { margin: 0 0 8px; color: var(--dim); }
  #info code { display: block; font-size: 11px; color: #b9c6ff; word-break: break-all; margin-bottom: 10px; }
  #info h4 { margin: 12px 0 0; font-size: 12px; color: var(--dim); font-weight: 500; }
  .tip { background: rgba(10,12,24,.9); padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); font: 12px system-ui, sans-serif; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 80px); background: var(--panel); border: 1px solid var(--line); padding: 10px 16px; border-radius: 999px; transition: transform .3s; }
  #toast.on { transform: translate(-50%, 0); }
  @media (max-width: 640px) { #side { width: auto; right: 16px; max-height: 45%; } #info { left: 16px; width: auto; max-height: 45%; } }
</style>
</head>
<body>
<div id="graph"></div>
<aside id="side" class="panel">
  <small>EVERYTHING TOGETHER</small>
  <h1>BRAIN</h1>
  <p class="sub">สมองกลเชื่อมทุกเครื่อง</p>
  <div id="legend"></div>
  <input id="q" placeholder="🔍 ค้นหาไฟล์ / โฟลเดอร์…" autocomplete="off">
  <ul id="hits"></ul>
  <div class="btns">
    <button id="rescan">⟳ สแกน</button>
    <button id="spin" class="ghost">↻ หมุน</button>
  </div>
  <div id="connect">
    <div class="me" id="me">ที่อยู่เครื่องนี้: …</div>
    <input id="peerIp" placeholder="IP คอมอีกเครื่อง เช่น 192.168.1.20" autocomplete="off">
    <input id="peerToken" placeholder="รหัสของเครื่องนั้น" autocomplete="off">
    <button id="connectBtn">🔗 เชื่อม</button>
    <div id="connectMsg"></div>
  </div>
  <ul id="peers"></ul>
  <button id="reload" class="ghost" style="width:100%">⟳ sync ตอนนี้</button>
  <ul id="machines"></ul>
  <a id="export" target="_blank" class="hint" style="display:block;color:#b9c6ff">📄 สรุปความรู้ให้ AI อ่าน (knowledge.md)</a>
  <div id="status"></div>
  <div class="hint">คลิก = ดูความเชื่อมโยง · Ctrl+คลิก = เปิดไฟล์ · ลาก = หมุน · สกรอล = ซูม</div>
</aside>
<aside id="info" class="panel" hidden></aside>
<div id="toast"></div>
<script src="viewer.bundle.js"></script>
</body>
</html>
